name: Deploy AICoworker to ai.hnkt.vn

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-ai-hnkt.yml
      - deployment/deploy-ai-hnkt.sh

permissions:
  contents: read

concurrency:
  group: deploy-ai-hnkt
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOMAIN: ai.hnkt.vn
      VPS_HOST: ${{ secrets.HNKT_AICOWORKER_VPS_HOST }}
      VPS_USER: ${{ secrets.HNKT_AICOWORKER_VPS_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HNKT_AICOWORKER_SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VPS_HOST}" || { echo "Missing HNKT_AICOWORKER_VPS_HOST"; exit 1; }
          test -n "${VPS_USER}" || { echo "Missing HNKT_AICOWORKER_VPS_USER"; exit 1; }
          test -n "${SSH_PRIVATE_KEY}" || { echo "Missing HNKT_AICOWORKER_SSH_PRIVATE_KEY"; exit 1; }

      - name: Install SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/aicoworker_hnkt_key
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/aicoworker_hnkt_key
          ssh-keyscan -H "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Upload deploy script
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/aicoworker_hnkt_key \
            deployment/deploy-ai-hnkt.sh \
            "${VPS_USER}@${VPS_HOST}:/tmp/deploy-ai-hnkt.sh"

      - name: Run deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/aicoworker_hnkt_key "${VPS_USER}@${VPS_HOST}" \
            "DOMAIN='${DOMAIN}' bash /tmp/deploy-ai-hnkt.sh"
